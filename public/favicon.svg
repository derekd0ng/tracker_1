<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#0d0d0d"/>

  <!-- Subtle glow behind hub -->
  <circle cx="50" cy="50" r="38" fill="url(#glow)"/>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.25"/>

  <!-- 8 spokes (octa) — inner r=17, outer r=34 -->
  <g stroke="url(#hub)" stroke-width="4" stroke-linecap="round">
    <!-- Cardinal -->
    <line x1="50" y1="16" x2="50" y2="33"/>
    <line x1="84" y1="50" x2="67" y2="50"/>
    <line x1="50" y1="84" x2="50" y2="67"/>
    <line x1="16" y1="50" x2="33" y2="50"/>
    <!-- Diagonal -->
    <line x1="73" y1="27" x2="62" y2="38"/>
    <line x1="73" y1="73" x2="62" y2="62"/>
    <line x1="27" y1="73" x2="38" y2="62"/>
    <line x1="27" y1="27" x2="38" y2="38"/>
  </g>

  <!-- Center hub -->
  <circle cx="50" cy="50" r="10" fill="url(#hub)"/>
</svg>
